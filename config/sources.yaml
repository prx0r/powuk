# powuk source registry
# Machine-readable configuration for all data sources.
# One source of truth. Generate DATA_SOURCES.md from this.

# Implementation stages:
#   discovery  — endpoint identified, may not work yet
#   raw        — raw data collected, not normalized
#   normalized — parsed into queryable records
#   monitored  — health/staleness checks passing
#   verified   — tests prove traceability, re-runnability, completeness

sources:
  # GRID
  - id: neso_demand
    domain: grid
    priority: P0
    stage: normalized
    mode: backfill
    cadence: hourly
    url: https://api.neso.energy/dataset/7a12172a-939c-404c-b581-a6128b74f588/resource/177f6fa4-ae49-4182-81ea-0c6b35f26ca6/download/demanddataupdate.csv
    format: csv
    auth: none
    rights: ogl
    recoverability: canonical
    history:
      type: embedded_full_history
      earliest: "2009"
      partition: release

  - id: neso_generation
    domain: grid
    priority: P0
    stage: normalized
    mode: backfill
    cadence: hourly
    url: https://api.neso.energy/dataset/88313ae5-94e4-4ddc-a790-593554d8c6b9/resource/f93d1835-75bc-43e5-84ad-12472b180a98/download/df_fuel_ckan.csv
    format: csv
    auth: none
    rights: ogl
    recoverability: canonical
    history:
      type: embedded_full_history
      earliest: "2009"
      partition: release

  - id: pvlive
    domain: grid
    priority: P0
    stage: raw
    mode: stream
    cadence: hourly
    url: https://api.pvlive.uk/pvlive/api/v4/gsp/0?data_format=json
    format: json
    auth: none
    rights: ogl
    recoverability: snapshot
    history:
      type: current_state_only
      snapshot_now: true

  - id: ukpn_flex
    domain: grid
    priority: P1
    stage: discovery
    mode: snapshot
    cadence: 12h
    url: https://ukpowernetworks.opendatasoft.com/api/explore/v2.1/catalog/datasets?limit=50
    format: json
    auth: none
    rights: ogl
    recoverability: snapshot
    notes: "Currently fetches dataset catalogue only, not flexibility data. Need actual dataset IDs."

  # TRADES
  - id: evspark_trades
    domain: trades
    priority: P0
    stage: raw
    mode: snapshot
    cadence: daily
    source_file: /root/ab/businesses/evspark/receipts/ch_sweep_areas.csv
    format: csv
    auth: none
    rights: local
    recoverability: snapshot
    notes: "Legacy seed from local file. Not portable. Replace with proper sources."

  # PLANNING
  - id: planning_apps
    domain: planning
    priority: P0
    stage: raw
    mode: paginated
    cadence: 2h
    url: https://www.planning.data.gov.uk/entity.json?dataset=planning-application
    page_size: 100
    max_pages: 50
    format: json
    auth: none
    rights: ogl
    recoverability: snapshot
    history:
      type: paginated_api
      earliest: "2016-01-01"
      partition: month

  # PROCUREMENT
  - id: contracts_finder
    domain: procurement
    priority: P0
    stage: raw
    mode: paginated
    cadence: 2h
    url: https://www.contractsfinder.service.gov.uk/Published/Notices/OCDS/Search
    page_size: 100
    max_pages: 50
    format: json
    auth: none
    rights: ogl
    recoverability: snapshot
    history:
      type: paginated_api
      partition: month

  - id: find_tender
    domain: procurement
    priority: P0
    stage: raw
    mode: paginated
    cadence: 2h
    url: https://www.find-tender.service.gov.uk/api/1.0/ocdsReleasePackages
    page_size: 50
    max_pages: 50
    format: json
    auth: none
    rights: ogl
    recoverability: snapshot
    history:
      type: paginated_api
      partition: month

  # BUSINESS CAPACITY
  - id: ch_capacity
    domain: business
    priority: P0
    stage: discovery
    mode: snapshot
    cadence: 12h
    api: companies_house
    sic_clusters:
      electrical: ["43210", "33140", "46520"]
      hvac: ["43220", "43290"]
      solar: ["35110", "35140", "43910"]
      ev: ["43210", "45200"]
      telecom: ["61100", "61200", "61900", "62011", "63110"]
      repair: ["95110", "95210", "95290", "33120"]
      construction: ["41100", "41202", "42990"]
    auth: api_key
    rights: crown_copyright
    recoverability: snapshot
    notes: "SIC search broken — all clusters return active_firms=1. Fix size parameter."

  # TRAINING
  - id: apar
    domain: training
    priority: P0
    stage: normalized
    mode: snapshot
    cadence: daily
    url: https://download.apprenticeships.education.gov.uk/apar/downloadcsv?filename=apar.csv
    format: csv
    auth: none
    rights: ogl
    recoverability: canonical
    history:
      type: current_state_only
      snapshot_now: true

  - id: ofqual
    domain: training
    priority: P0
    stage: raw
    mode: snapshot
    cadence: daily
    url: https://register-api.ofqual.gov.uk/api/qualifications?pageSize=500
    format: json
    auth: none
    rights: ogl
    recoverability: canonical
    notes: "Active count returns 0 — status field filter may be wrong."

  # LABOUR
  - id: ons_labour
    domain: labour
    priority: P0
    stage: raw
    mode: backfill
    cadence: daily
    url: https://www.ons.gov.uk/file?uri=/employmentandlabourmarket/peopleinwork/employmentandemployeetypes/datasets/labourdemandvolumesbystandardoccupationclassificationsoc2020uk/january2017tojuly2026/labourdemandbyoccupation.xlsx
    format: xlsx
    auth: none
    rights: ogl
    recoverability: canonical
    history:
      type: embedded_full_history
      earliest: "2017-01"
      partition: release

  - id: ashe_wages
    domain: labour
    priority: P0
    stage: normalized
    mode: backfill
    cadence: daily
    url: https://www.ons.gov.uk/file?uri=/employmentandlabourmarket/peopleinwork/earningsandworkinghours/datasets/regionbyoccupation2digitsocashetable3/2025provisional/ashetable32025provisional.zip
    format: xlsx
    auth: none
    rights: ogl
    recoverability: canonical
    notes: "ASHE Table 3: Region × SOC2 × earnings. Wage/shadow-price proxy for skilled labour."
    history:
      type: embedded_full_history
      partition: release

  # CERTIFICATION
  - id: refcom
    domain: certification
    priority: P0
    stage: aggregate_only
    mode: snapshot
    cadence: daily
    url: https://api.refcom.org.uk/api/PublicCompany/GetFgasActiveCertificateCount
    format: json
    auth: none
    rights: ogl
    recoverability: snapshot
    notes: "Count works (11,295), entity-level GetByIndex returns nothing. Mark aggregate_only until entity fetch works."
    history:
      type: current_state_only
      snapshot_now: true
